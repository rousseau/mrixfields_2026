# ─────────────────────────────────────────────────────────────────────────────
# MMFM vectorisé — GUIDANCE CONDITIONNELLE style CFG (expérience H2, 2026-09-14).
#
# Copie EXACTE de configs/mmfm/vectorized_trajectory.yaml (production). UNE
# SEULE clé change : model.cond_dropout_prob: 0.1. Le bloc `data:` est
# identique (même cache, même split) pour que l'écart avec la production ne
# puisse venir que de ce seul changement.
#
# ORIGINE. Comparaison avec NVIDIA/NV-Generate-CTMR (rectified flow via MONAI,
# RFlowScheduler + DiffusionModelUNetMaisi) : leur conditionnement de classe
# utilise un dropout d'étiquette à l'entraînement (10 %) et une guidance
# scale=15 à l'inférence — mécanisme absent de notre flow. Hypothèse : à
# budget de conditionnement égal, amplifier le signal de contraste (déjà
# identifié comme un levier fort — FiLM capte 5.2 % de variance contre 0.026 %
# pour concat, voir mmfm_vectorized.py) pourrait réduire le lissage perceptuel
# qui pénalise systématiquement le SSIM/LPIPS du mmfm.
#
# MÉCANISME. `cond_dropout_prob > 0` réserve un id de classe NUL en dernier
# index de la table d'embedding (voir arch_vector.py::build_vector_mmfm) ;
# mmfm_core.py::train() y bascule `y_tgt` (label de contraste, PAS le label
# du régularisateur de cycle) avec cette probabilité. La guidance elle-même
# est un paramètre D'INFÉRENCE (`--guidance_scale`, infer_mmfm_unified.py),
# à balayer sur ce même checkpoint — aucun réentraînement supplémentaire par
# valeur de scale testée.
#
# output_subdir distinct de la production : ne touche pas
# outputs/mmfm/vectorized_trajectory/.
# ─────────────────────────────────────────────────────────────────────────────

method: mmfm3d_vectorized
task_name: mmfm_vectorized_trajectory_cfg

vae:
  vae_type: medvae_finetune
  model_name: medvae_4_1_3d
  frozen: true
  checkpoint:
  latent_channels: 1

model:
  hidden_dim: 1024
  num_blocks: 4
  time_embed_dim: 256
  class_embed_dim: 128
  dropout: 0.0
  time_scale: 1000.0
  time_cond: film
  latent_mean: 19.913378
  latent_scale: 18.125440
  # ── SEUL CHANGEMENT vs vectorized_trajectory.yaml ──
  cond_dropout_prob: 0.1

data:
  modalities:
  - T1W
  - T2W
  - T2FLAIR
  fields:
  - 0.1T
  - 1.5T
  - 3T
  - 5T
  - 7T
  volume_size:
  - 192
  - 224
  - 192
  target_spacing:
  - 1.0
  - 1.0
  - 1.0
  encode_tile: [96, 112, 96]
  encode_tile_margin: 16
  split: retro_train
  output_subdir: mmfm/vectorized_trajectory_cfg
  percentile_lower: 0.5
  percentile_upper: 99.5
  max_volumes_per_class:
  num_workers: 4
  use_latent_cache: true
  latent_cache_root: outputs/mmfm/latent_cache/vectorized
  latent_cache_dir: outputs/mmfm/latent_cache/vectorized/medvae_finetune_c4d1e200/retro_train
  latent_preload_ram: true
  flip_lr_prob: 0.5
  flip_axis: 0
  random_crop_prob: 0.0

train:
  marginal_mode: trajectory
  loss: mse
  flip_per_step: true
  batch_size: 1
  total_iters: 25000
  num_targets_per_step: 1
  adjacent_only: false
  identity_prob: 0.1
  warmup_steps: 2000
  lr: 2.0e-5
  sigma: 0.0
  ot_method: exact
  accumulation_steps: 1
  save_every: 2500
  keep_checkpoints: 2
  print_every: 100
  use_amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  ema_decay: 0.9999

inference:
  n_steps: 20
  ode_solver: euler
  norm_mode: field_fixed
