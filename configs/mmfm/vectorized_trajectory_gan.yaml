# ─────────────────────────────────────────────────────────────────────────────
# Palier 2+ du plan GAN latent (2026-09-21/22, style UNSB) : copie STRICTE de
# vectorized_trajectory.yaml (même `data:`, même cache, même correctifs
# d'audit) + les clés train.lambda_gan/gan_*/disc_*.
#
# NE PAS lancer from scratch : chemin recommandé par le plan (G repart de la
# production, D repart de zéro, D n'a aucune dépendance côté G) —
#   PYTHONPATH=src python src/cfm/train_mmfm_unified.py \
#       --method mmfm3d_vectorized --config configs/mmfm/vectorized_trajectory_gan.yaml \
#       --env local \
#       --resume outputs/mmfm/vectorized_trajectory/weights/model_final.pth \
#       --resume_weights_only
#
# gan_start=0 (contrairement à synthetic_gan.yaml) : le test du Palier 2 est
# volontairement plus dur — un modèle DÉJÀ BON se déstabilise-t-il dès que le
# GAN s'active, plutôt que de laisser le temps d'agir sur un run court.
# ─────────────────────────────────────────────────────────────────────────────

method: mmfm3d_vectorized
task_name: mmfm_vectorized_trajectory_gan

vae:
  vae_type: medvae_finetune
  model_name: medvae_4_1_3d
  frozen: true
  checkpoint:
  latent_channels: 1

model:
  hidden_dim: 1024
  num_blocks: 4
  time_embed_dim: 256
  class_embed_dim: 128
  dropout: 0.0
  time_scale: 1000.0
  time_cond: film
  latent_mean: 19.913378
  latent_scale: 18.125440
  # Discriminateur (défauts de build_latent_discriminator, explicites ici).
  disc_hidden_dim: 256
  disc_num_blocks: 3
  disc_time_embed_dim: 128
  disc_class_embed_dim: 64
  disc_dropout: 0.1

data:
  modalities:
  - T1W
  - T2W
  - T2FLAIR
  fields:
  - 0.1T
  - 1.5T
  - 3T
  - 5T
  - 7T
  volume_size:
  - 192
  - 224
  - 192
  target_spacing:
  - 1.0
  - 1.0
  - 1.0
  encode_tile: [96, 112, 96]
  encode_tile_margin: 16
  split: retro_train
  output_subdir: mmfm/vectorized_trajectory_gan
  percentile_lower: 0.5
  percentile_upper: 99.5
  max_volumes_per_class:
  num_workers: 4
  use_latent_cache: true
  latent_cache_root: outputs/mmfm/latent_cache/vectorized
  latent_cache_dir: outputs/mmfm/latent_cache/vectorized/medvae_finetune_c4d1e200/retro_train
  latent_preload_ram: true
  flip_lr_prob: 0.5
  flip_axis: 0
  random_crop_prob: 0.0

train:
  marginal_mode: trajectory
  loss: mse
  flip_per_step: true
  batch_size: 1
  # 4-8% du budget de production (25000) par palier, PAS from scratch — voir
  # le plan §Protocole de validation, Palier 2. Ajuster ici avant chaque essai.
  # PALIER 3 (2026-09-22) : 2000 -> 5000 (continuation, pas repart de zero —
  # voir le --resume complet, pas --resume_weights_only, pointant vers le
  # model_final.pth du Palier 2, qui restaure aussi D/disc_optimizer).
  total_iters: 5000
  num_targets_per_step: 1
  adjacent_only: false
  identity_prob: 0.1
  warmup_steps: 100
  lr: 2.0e-5
  sigma: 0.0
  ot_method: exact
  accumulation_steps: 1
  save_every: 500
  keep_checkpoints: 2
  print_every: 50
  use_amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  ema_decay: 0.9999
  # ── Perte adversariale latente (Palier 2+) ─────────────────────────────────
  lambda_gan: 0.05
  lambda_gan_final: 0.05
  gan_start: 0
  gan_every: 1
  gan_n_steps: 4
  disc_lr: 2.0e-5
  disc_grad_clip: 1.0

inference:
  n_steps: 20
  ode_solver: euler
  norm_mode: field_fixed
