# ─────────────────────────────────────────────────────────────────────────────
# Palier 1 du plan GAN latent (2026-09-21/22, style UNSB) : copie STRICTE de
# synthetic.yaml + les cles train.lambda_gan/gan_*/disc_*. `total_iters`
# INCHANGE (4000) -- seul ajout, la porte de eval_synthetic.py (bend>=0.80,
# nRMSE<=2x bruit) doit rester franchie, ET les indicateurs de sante GAN
# (d_acc, grad_norm_d) doivent rester dans les bornes du plan.
#
# Usage :
#   PYTHONPATH=src python src/cfm/train_mmfm_unified.py \
#       --method mmfm3d_synthetic --config configs/mmfm/synthetic_gan.yaml --env local
#   PYTHONPATH=src python src/cfm/eval_synthetic.py --config configs/mmfm/synthetic_gan.yaml
# ─────────────────────────────────────────────────────────────────────────────

task_name: mmfm_synthetic_gan
method: mmfm3d_synthetic

vae:
  vae_type: identity

synthetic:
  dim: 64
  bend: 0.6
  subject_scale: 1.0
  noise: 0.05
  seed: 0

model:
  time_scale: 1000.0
  hidden_dim: 512
  num_blocks: 4
  time_embed_dim: 256
  class_embed_dim: 128
  dropout: 0.0
  latent_mean: 0.0
  latent_scale: 1.0
  # Discriminateur (defauts de build_latent_discriminator, explicites ici pour
  # que ce fichier documente la recette testee au Palier 1).
  disc_hidden_dim: 256
  disc_num_blocks: 3
  disc_time_embed_dim: 128
  disc_class_embed_dim: 64
  disc_dropout: 0.1

data:
  modalities: [c0, c1, c2]
  fields: [f0, f1, f2, f3, f4]
  output_subdir: mmfm/synthetic_gan
  split: retro_train
  volume_size: [4, 4, 4]
  target_spacing: [1.0, 1.0, 1.0]
  num_workers: 0
  use_latent_cache: true
  latent_cache_root: outputs/mmfm/synthetic
  latent_cache_dir: outputs/mmfm/synthetic/generated
  n_per_class: 256
  data_seed: 1

train:
  total_iters: 4000
  batch_size: 64
  num_targets_per_step: 1
  lr: 1.0e-3
  warmup_steps: 100
  sigma: 0.0
  ot_method: exact
  identity_prob: 0.1
  adjacent_only: false
  accumulation_steps: 1
  use_amp: false
  grad_clip: 1.0
  ema_decay: 0.999
  save_every: 2000
  print_every: 200
  keep_checkpoints: 1
  # ── Perte adversariale latente (Palier 1) ──────────────────────────────────
  lambda_gan: 0.05        # calibration du plan : subordonne a la MSE, pas 1.0 (defaut UNSB)
  lambda_gan_final: 0.05
  gan_start: 500           # bas (Palier 1) : le run est court (4000 iters), laisser le temps d'agir
  gan_every: 1
  gan_n_steps: 4
  disc_lr: 1.0e-3           # meme echelle que lr (G) sur ce harnais en fp32/dim 64
  disc_grad_clip: 1.0
